# Spike da Fase 0: confirma se a Steam devolve BRL para um servidor fora do Brasil.
name: Spike preços Steam

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  steam-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mostra a saída do runner
        run: |
          python --version
          curl -s --max-time 10 https://ipinfo.io/country || echo "pais indisponivel"
      - name: Roda o spike
        run: python spikes/steam_prices.py
