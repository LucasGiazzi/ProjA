  - name: ml_features_publisher_rate_excludes_the_current_day
    description: Outro jogo da publisher em promoção entra na taxa só no dia seguinte.
    model: ml_features
    given:
      - input: ref('fct_price_daily')
        rows:
          - {app_id: 1, price_date: 2026-01-01, initial_cents: 1000, discount_percent: 0, is_on_sale: false}
          - {app_id: 2, price_date: 2026-01-01, initial_cents: 1000, discount_percent: 50, is_on_sale: true}
          - {app_id: 1, price_date: 2026-01-02, initial_cents: 1000, discount_percent: 0, is_on_sale: false}
      - input: ref('dim_games')
        rows:
          - {app_id: 1, publisher: Editora, release_date: 2025-01-01}
          - {app_id: 2, publisher: Editora, release_date: 2025-01-01}
      - input: ref('steam_sale_calendar')
        rows:
          - {sale_name: summer, start_date: 2026-06-25, last_sale_date: 2026-07-08}
    expect:
      rows:
        - {app_id: 1, price_date: 2026-01-01, publisher_sale_rate: null}
        - {app_id: 2, price_date: 2026-01-01, publisher_sale_rate: null}
        - {app_id: 1, price_date: 2026-01-02, publisher_sale_rate: 0.5}
