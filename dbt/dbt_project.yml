name: vale_esperar
version: "0.1.0"
profile: vale_esperar

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Fração mínima de jogos com resposta por dia, definida no design.
  min_daily_volume_rate: 0.95
  # Antes desta data, os preços em BRL do ITAD têm ruído de conversão.
  itad_history_start_date: "2019-01-01"

models:
  vale_esperar:
    staging:
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table

seeds:
  vale_esperar:
    catalog:
      +column_types:
        app_id: bigint
        name: varchar
        source: varchar
